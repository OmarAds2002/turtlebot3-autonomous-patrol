# AMCL localization config — used by slam_launch.py
# only manages map_server + amcl (no planner/controller/bt_navigator)
# for full Nav2 stack, use nav2_params.yaml

map_server:
  ros__parameters:
    yaml_filename: "/home/omarads/maps/four_rooms.yaml"
    use_sim_time: true

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: "scan"
    map_topic: "map"
    # required in Jazzy — filter won't init without this exact string
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    laser_model_type: "likelihood_field"
    laser_max_range: 8.0
    laser_min_range: -1.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    tf_broadcast: true
    save_pose_rate: 0.5
    # auto-set pose at map origin — map_frame (0,0), NOT Gazebo coords
    # offset: map_x ≈ gz_x - 1, map_y ≈ gz_y - 5.5
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    # only map_server + amcl — SLAM launch doesn't need the full Nav2 stack
    node_names: ['map_server', 'amcl']