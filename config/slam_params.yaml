# slam_toolbox async mode config
# NOTE: slam_toolbox in ROS2 Jazzy is a lifecycle node
# must configure -> activate via launch (not auto-started)

slam_toolbox:
  ros__parameters:
    solver_plugin: "solver_plugins::CeresSolver"
    ceres_linear_solver: "SPARSE_NORMAL_CHOLESKY"
    resolution: 0.05
    max_laser_range: 8.0
    base_frame: "base_footprint"
    odom_frame: "odom"
    map_frame: "map"
    use_sim_time: true
    mode: "mapping"
    # how far/much to rotate before adding a new scan
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5